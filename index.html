<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Ерлан Сакенов">
<meta property="og:image" content="https://sakenov.kz/cover.jpg">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ерлан Сакенов</title>
<meta name="description" content="Telegram-канал и социальные сети Ерлана Сакенова">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Одна узкая колонка: шапка с инициалами, затем две группы карточек-ссылок. Акцент — небесно-голубой и золото флага Казахстана. */
  :root {
    --bg: #f3f6f7; --card: #ffffff; --text: #12191c; --muted: #5d6b70;
    --line: #dde5e8; --sky: #00a3bd; --gold: #f2b705;
    --shadow: 0 1px 2px rgba(10,40,50,.05), 0 8px 24px rgba(10,40,50,.06);
    --display: Unbounded, "Arial Black", system-ui, sans-serif;
    --body: Manrope, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1316; --card: #151d21; --text: #eef3f5; --muted: #93a3a9;
      --line: #233035; --sky: #2cc3dc; --gold: #f5c430; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1316; --card: #151d21; --text: #eef3f5; --muted: #93a3a9;
    --line: #233035; --sky: #2cc3dc; --gold: #f5c430; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 540px; margin: 0 auto; padding-block: 24px 64px; }
  header { text-align: center; margin-bottom: 36px; }
  .cover {
    display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover;
    object-position: 45% 40%; border-radius: 20px; margin-bottom: 24px;
    background: var(--line); box-shadow: var(--shadow);
    border-bottom: 4px solid var(--gold);
  }
  h1 { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
  .bio { color: var(--muted); margin: 0; line-height: 1.5; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 600; margin: 32px 0 12px;
  }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  a.item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: inherit; text-decoration: none; box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  a.item:hover { transform: translateY(-2px); border-color: var(--sky); }
  a.item:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { a.item { transition: none; } a.item:hover { transform: none; } }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center; color: #fff;
  }
  .icon svg { width: 22px; height: 22px; fill: currentColor; }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow { color: var(--muted); flex: none; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 48px; }
</style>

</head>
<body>
<main>
  <header>
    <img class="cover" src="cover.jpg" alt="Ерлан Сакенов" width="1280" height="961">
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
  </header>

  <h2>Социальные сети</h2>
  <div class="list" id="socials"></div>

  <h2>Астана — Что? Где? Когда?</h2>
  <div class="list" id="channels"></div>

  <h2>Авто Казахстан</h2>
  <div class="list" id="auto"></div>

  <h2>Sakenov Airlines</h2>
  <div class="list" id="avia"></div>
  <footer id="footer"></footer>
</main>

<script>
  // ===== Редактируйте только этот блок =====
  const PROFILE = {
    name: "Ерлан Сакенов",
    bio: "Здесь все мои площадки — подписывайтесь там, где вам удобно.",
  };

  const CHANNELS = [
    { type: "site", name: "Новостной сайт", desc: "Новости и афиша Астаны · myastanacity.kz", url: "https://myastanacity.kz/" },
    { type: "telegram", name: "Telegram-канал", desc: "Новости Астаны и Казахстана · @myastanacity", url: "https://t.me/myastanacity" },
    { type: "whatsapp", name: "Канал в WhatsApp", desc: "Новости Астаны и Казахстана · паблик", url: "https://whatsapp.com/channel/0029Va7hyQY5K3zSsFSYTM3C" },
    { type: "instagram", name: "Паблик в Instagram", desc: "@myastanacity", url: "https://www.instagram.com/myastanacity/" },
    { type: "facebook", name: "Группа в Facebook", desc: "Астана — Что? Где? Когда?", url: "https://www.facebook.com/groups/proastana/" },
  ];

  const AUTO = [
    { type: "telegram", name: "Telegram-канал", desc: "Автомобильный рынок Казахстана и мира · @auto_qazaqstan", url: "https://t.me/auto_qazaqstan" },
  ];

  const AVIA = [
    { type: "telegram", name: "Telegram-канал", desc: "Авиация Казахстана и мира · @SakenovAirlines", url: "https://t.me/SakenovAirlines" },
    { type: "instagram", name: "Новости аэропорта Астаны", desc: "Лента из Instagram аэропорта Нурсултан Назарбаев", url: "airport/" },
  ];

  // type: instagram | youtube | facebook | whatsapp | telegram | site
  const SOCIALS = [
    { type: "telegram",  name: "Личный Telegram-канал", desc: "Кое-что про Астану, страну и мир · @YerlanSakenov", url: "https://t.me/YerlanSakenov" },
    { type: "instagram", name: "Instagram", desc: "@yerlansakenov", url: "https://www.instagram.com/yerlansakenov/" },
    { type: "youtube",   name: "YouTube",   desc: "Ерлан Сакенов", url: "https://www.youtube.com/channel/UCBT9Mr-xuPXP1cf8DwgD44Q" },
    { type: "facebook",  name: "Facebook",  desc: "yerlansakenov", url: "https://www.facebook.com/yerlansakenov" },
  ];
  // =========================================

  const ICONS = {
    telegram: ["#229ED9", '<path d="M21.9 4.3 18.6 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.5l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.5 3c.9-.3 1.7.2 1.4 1.3z"/>'],
    instagram: ["linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)", '<path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21.9 8c0-1.6-.4-3-1.6-4.2C19 2.6 17.6 2.2 16 2.1 14.4 2 9.6 2 8 2.1c-1.6.1-3 .5-4.2 1.7C2.6 5 2.2 6.4 2.1 8 2 9.6 2 14.4 2.1 16c.1 1.6.5 3 1.7 4.2 1.2 1.2 2.6 1.6 4.2 1.7 1.6.1 6.4.1 8 0 1.6-.1 3-.5 4.2-1.7 1.2-1.2 1.6-2.6 1.7-4.2.1-1.6.1-6.4 0-8zm-2.1 9.8a3.3 3.3 0 0 1-1.8 1.8c-1.3.5-4.3.4-5.7.4s-4.4.1-5.7-.4a3.3 3.3 0 0 1-1.8-1.8c-.5-1.3-.4-4.3-.4-5.7s-.1-4.4.4-5.7A3.3 3.3 0 0 1 6.3 4.6C7.6 4 10.6 4.2 12 4.2s4.4-.1 5.7.4a3.3 3.3 0 0 1 1.8 1.8c.5 1.3.4 4.300.4 5.7s.1 4.4-.4 5.7z"/>'],
    facebook: ["#1877F2", '<path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/>'],
    whatsapp: ["#25D366", '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/>'],
    youtube: ["#FF0000", '<path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15V9l5.8 3-5.8 3z"/>'],
    site: ["#5B6B70", '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.4 1.1-2.8 1.9-4zm2.3 10H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.4-1.1 2.8-1.9 4z"/>'],
  };

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(list, el, fallbackType) {
    el.innerHTML = list.map(i => {
      const [bg, path] = ICONS[i.type || fallbackType] || ICONS.site;
      return `<a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">
        <span class="icon" style="background:${bg}"><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg></span>
        <span class="meta"><div class="name">${esc(i.name)}</div><div class="desc">${esc(i.desc || "")}</div></span>
        <span class="arrow" aria-hidden="true">→</span></a>`;
    }).join("");
  }

  document.getElementById("name").textContent = PROFILE.name;
  document.getElementById("bio").textContent = PROFILE.bio;
  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;
  render(CHANNELS, document.getElementById("channels"), "telegram");
  render(AUTO, document.getElementById("auto"), "telegram");
  render(AVIA, document.getElementById("avia"), "telegram");
  render(SOCIALS, document.getElementById("socials"));
</script>
</body>
</html>
