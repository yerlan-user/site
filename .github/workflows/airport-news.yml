name: Новости аэропорта из Instagram

on:
  schedule:
    - cron: "17 * * * *"   # каждый час
  workflow_dispatch:        # ручной запуск во вкладке Actions

permissions:
  contents: write

concurrency:
  group: airport-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать посты
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TARGET: ${{ vars.IG_TARGET }}
        run: python scripts/fetch_airport_news.py

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airport
          if git diff --cached --quiet; then
            echo "Новых постов нет"
          else
            git commit -m "Новости аэропорта: обновление ленты"
            git push
          fi
